services:
  notice-hub:
    build: .
    image: notice-hub:1.0.0
    container_name: notice-hub
    restart: unless-stopped
    ports:
      # 只绑内网网卡 → 公网接口完全不可达。
      # 实际绑定地址由 .env 的 BIND_IP 决定（.env 不入版本库）；
      # 不配则退回 127.0.0.1（只有本机可达，最安全）。
      # 想监听所有网卡就写 "8091:8091"。
      - "${BIND_IP:-127.0.0.1}:8091:8091"
    env_file:
      - .env
    environment:
      PORT: "8091"
      NOTICE_DATA_DIR: /app/data
    volumes:
      # 数据库落在宿主机 /data/notice-hub/data，重建容器不丢数据
      - ./data:/app/data
      # 静态目录也挂出来：新生成的原文页即时生效，不用重建镜像
      - ./public:/app/public
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
